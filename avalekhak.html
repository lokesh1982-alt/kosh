<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>Avalekhak</title>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#2E6FA3"/>
<link rel="apple-touch-icon" href="av-icon-192.png"/>
<link rel="manifest" href="av-manifest.json"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap');
:root{
  --bg:#E8F1FA;--card:#FFFFFF;--card2:#EEF4FA;
  --border:#DCE9F4;
  --blue:#2E6FA3;--blue-dark:#1F3A52;--blue-light:#EEF4FA;
  --amber:#F2A65A;--amber-dark:#B5602C;
  --text:#1F3A52;--text2:#5B6D7D;--text3:#8FA3B5;
  --red:#C0392B;--red-light:#FBEAE8;
  --green:#1E7A4C;--green-light:#E6F4EC;
  --radius:14px;--radius-sm:9px;
  --shadow:0 1px 3px rgba(31,58,82,0.08),0 1px 2px rgba(31,58,82,0.04);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}
.app-logo-text{font-family:'Fraunces',serif;font-weight:600;color:var(--blue-dark);}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}

.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;}
.topbar img{width:36px;height:36px;border-radius:10px;flex-shrink:0;}
.topbar-title{font-size:1.15rem;}
.topbar-sub{font-size:0.62rem;color:var(--text3);letter-spacing:0.05em;text-transform:uppercase;}

.main{max-width:520px;margin:0 auto;padding:0 16px 100px;}

.search-bar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:16px;}
.search-bar input{border:none;outline:none;background:none;font-size:0.85rem;color:var(--text);flex:1;}
.search-bar input::placeholder{color:var(--text3);}

.sec-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.sec-title{font-size:0.85rem;font-weight:600;color:var(--blue-dark);}
.link-btn{background:none;border:none;font-size:0.76rem;font-weight:600;color:var(--amber-dark);padding:4px;}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.folder-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:left;}
.folder-card .ic{font-size:22px;margin-bottom:6px;}
.folder-card .name{font-size:0.82rem;font-weight:600;color:var(--blue-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.folder-card .count{font-size:0.68rem;color:var(--text3);margin-top:2px;}

.doc-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.doc-card .thumb{height:110px;background:var(--card2);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.doc-card .thumb img{width:100%;height:100%;object-fit:cover;}
.doc-card .meta{padding:9px 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:6px;}
.doc-card .title{font-size:0.76rem;font-weight:600;color:var(--blue-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px;}
.doc-card .sub{font-size:0.64rem;color:var(--text3);}
.doc-card .share-ic{background:none;border:none;font-size:15px;color:var(--text2);flex-shrink:0;}

.empty-state{text-align:center;padding:50px 20px;color:var(--text3);}
.empty-state .ic{font-size:2.4rem;margin-bottom:10px;}
.empty-state .txt{font-size:0.85rem;}

.fab{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:60px;height:60px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:24px;box-shadow:0 4px 14px rgba(46,111,163,0.4);z-index:50;display:flex;align-items:center;justify-content:center;}
.fab:active{transform:translateX(-50%) scale(0.94);}

.back-row{display:flex;align-items:center;gap:6px;margin-bottom:12px;font-size:0.9rem;font-weight:600;color:var(--blue-dark);cursor:pointer;}

.modal-overlay{position:fixed;inset:0;background:rgba(31,58,82,0.45);z-index:350;display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;}
.modal-title{font-size:1.05rem;font-weight:700;color:var(--blue-dark);margin-bottom:14px;}
.form-input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:0.9rem;color:var(--text);background:#fff;}
.form-label{font-size:0.78rem;color:var(--text2);margin-bottom:5px;display:block;font-weight:500;}
.btn-primary{background:var(--blue);color:#fff;border:none;border-radius:24px;padding:12px 20px;font-size:0.85rem;font-weight:600;}
.btn-amber{background:var(--amber);color:#fff;border:none;border-radius:24px;padding:12px 20px;font-size:0.85rem;font-weight:600;}
.btn-outline{background:#fff;color:var(--blue-dark);border:1px solid var(--border);border-radius:24px;padding:12px 20px;font-size:0.85rem;font-weight:600;}
.btn-danger{background:var(--red);color:#fff;border:none;border-radius:24px;padding:12px 20px;font-size:0.85rem;font-weight:600;}
.emoji-pick{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.emoji-pick span{font-size:20px;padding:6px 9px;border-radius:8px;background:var(--card2);cursor:pointer;}
.emoji-pick span.sel{background:var(--blue);}

/* Capture / Crop screen */
.capture-screen{position:fixed;inset:0;background:var(--bg);z-index:300;display:none;flex-direction:column;padding:16px;overflow-y:auto;}
.capture-screen.open{display:flex;}
.crop-stage{position:relative;width:100%;background:var(--card2);border-radius:var(--radius);overflow:hidden;touch-action:none;}
.crop-stage img,.crop-stage canvas{display:block;width:100%;height:auto;}
.crop-svg{position:absolute;top:0;left:0;width:100%;height:100%;}
.corner-handle{fill:#2E6FA3;stroke:#fff;stroke-width:2;cursor:grab;}
.mode-pills{display:flex;justify-content:center;gap:8px;margin:14px 0;}
.mode-pill{background:var(--card2);color:var(--text2);border:none;border-radius:8px;padding:7px 16px;font-size:0.76rem;}
.mode-pill.active{background:var(--blue);color:#fff;font-weight:600;}
.cap-actions{display:flex;justify-content:center;gap:10px;margin-top:auto;padding-top:16px;}

.viewer-screen{position:fixed;inset:0;background:#000;z-index:300;display:none;flex-direction:column;}
.viewer-screen.open{display:flex;}
.viewer-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;color:#fff;}
.viewer-top button{background:rgba(255,255,255,0.15);border:none;color:#fff;border-radius:8px;padding:6px 12px;font-size:0.8rem;}
.viewer-img-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;}
.viewer-img-wrap img{max-width:100%;max-height:100%;}

.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--blue-dark);color:#fff;padding:10px 18px;border-radius:20px;font-size:0.8rem;z-index:400;opacity:0;transition:opacity 0.3s;pointer-events:none;}
.toast.show{opacity:1;}

.hidden{display:none!important;}
</style>
</head>
<body>

<div class="topbar">
  <img src="av-icon-192.png" alt="Avalekhak"/>
  <div>
    <div class="topbar-title app-logo-text">अवलेखक</div>
    <div class="topbar-sub">Avalekhak &middot; Document Scanner</div>
  </div>
</div>

<div class="main">

  <div class="search-bar">
    <span>🔍</span>
    <input type="text" id="search-input" placeholder="Search documents..." oninput="handleSearch()"/>
  </div>
  <div style="text-align:right;margin:-8px 0 14px">
    <button class="link-btn" onclick="document.getElementById('pdf-import-input').click()">📥 Import PDF</button>
    <input type="file" id="pdf-import-input" accept="application/pdf" style="display:none" onchange="onPdfImportSelected(event)"/>
  </div>

  <!-- FOLDERS HOME VIEW -->
  <div id="view-home">
    <div class="sec-row">
      <div class="sec-title">Folders</div>
      <button class="link-btn" onclick="openNewFolderModal()">+ New Folder</button>
    </div>
    <div id="folders-grid" class="grid-2"></div>
  </div>

  <!-- FOLDER DETAIL VIEW -->
  <div id="view-folder" class="hidden">
    <div class="back-row" onclick="goHome()"><span>‹</span> <span id="folder-detail-name"></span></div>
    <div class="sec-row">
      <div></div>
      <div style="display:flex;gap:14px">
        <button class="link-btn" onclick="openRenameFolderModal()">Rename</button>
        <button class="link-btn" style="color:var(--red)" onclick="confirmDeleteFolder()">Delete folder</button>
      </div>
    </div>
    <div id="docs-grid" class="grid-2"></div>
  </div>

</div>

<button class="fab" onclick="startCapture()">📷</button>

<!-- NEW FOLDER MODAL -->
<div class="modal-overlay" id="new-folder-modal">
  <div class="modal">
    <div class="modal-title">New Folder</div>
    <div style="margin-bottom:12px">
      <label class="form-label">Folder name</label>
      <input class="form-input" id="new-folder-name" placeholder="e.g. Receipts"/>
    </div>
    <div class="form-label">Icon</div>
    <div class="emoji-pick" id="folder-emoji-pick"></div>
    <div style="display:flex;gap:10px;margin-top:10px">
      <button class="btn-outline" style="flex:1" onclick="closeModal('new-folder-modal')">Cancel</button>
      <button class="btn-primary" style="flex:1" onclick="saveNewFolder()">Create</button>
    </div>
  </div>
</div>

<!-- RENAME FOLDER MODAL -->
<div class="modal-overlay" id="rename-folder-modal">
  <div class="modal">
    <div class="modal-title">Rename Folder</div>
    <div style="margin-bottom:14px">
      <label class="form-label">Folder name</label>
      <input class="form-input" id="rename-folder-name"/>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn-outline" style="flex:1" onclick="closeModal('rename-folder-modal')">Cancel</button>
      <button class="btn-primary" style="flex:1" onclick="saveRenameFolder()">Save</button>
    </div>
  </div>
</div>

<!-- SAVE DOCUMENT MODAL -->
<div class="modal-overlay" id="save-doc-modal">
  <div class="modal">
    <div class="modal-title">Save Document</div>
    <div style="margin-bottom:12px">
      <label class="form-label">Title</label>
      <input class="form-input" id="save-doc-title" placeholder="e.g. Electricity Bill"/>
    </div>
    <div style="margin-bottom:14px">
      <label class="form-label">Folder</label>
      <select class="form-input" id="save-doc-folder"></select>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn-outline" style="flex:1" onclick="closeModal('save-doc-modal')">Cancel</button>
      <button class="btn-primary" style="flex:1" onclick="confirmSaveDocument()">Save</button>
    </div>
  </div>
</div>

<!-- CAPTURE / CROP SCREEN -->
<div class="capture-screen" id="capture-screen">
  <div class="back-row" onclick="cancelCapture()"><span>‹</span> Cancel</div>
  <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none" onchange="onImageCaptured(event)"/>
  <div id="capture-empty" style="text-align:center;padding:60px 20px">
    <div style="font-size:2.4rem;margin-bottom:14px">📷</div>
    <div style="font-size:0.9rem;color:var(--text2);margin-bottom:18px">Take a photo of your document</div>
    <button class="btn-primary" onclick="document.getElementById('camera-input').click()">Open Camera</button>
    <div id="engine-status" style="font-size:0.72rem;color:var(--text3);margin-top:14px">⏳ Loading scanner engine (first time only, needs a moment)...</div>
  </div>
  <div id="capture-working" class="hidden">
    <div class="sec-title" style="text-align:center;margin-bottom:10px" id="crop-stage-label">Adjust the corners</div>
    <div class="crop-stage" id="crop-stage">
      <canvas id="crop-canvas"></canvas>
      <svg class="crop-svg" id="crop-svg"></svg>
    </div>
    <div class="mode-pills" id="mode-pills">
      <button class="mode-pill active" data-mode="color" onclick="setColorMode('color')">Color</button>
      <button class="mode-pill" data-mode="gray" onclick="setColorMode('gray')">Grayscale</button>
      <button class="mode-pill" data-mode="bw" onclick="setColorMode('bw')">B&amp;W</button>
      <button class="mode-pill" data-mode="enhance" onclick="setColorMode('enhance')">✨ Auto Enhance</button>
    </div>
    <div id="pages-strip" style="display:flex;gap:8px;overflow-x:auto;margin-bottom:8px"></div>
    <div class="cap-actions">
      <button class="btn-outline" onclick="retakePage()">Retake</button>
      <button class="btn-outline" onclick="addAnotherPage()">+ Add Page</button>
      <button class="btn-amber" onclick="finishCapture()">Done ✓</button>
    </div>
  </div>
</div>

<!-- VIEWER SCREEN -->
<div class="viewer-screen" id="viewer-screen">
  <div class="viewer-top">
    <button onclick="closeViewer()">‹ Close</button>
    <div id="viewer-title" style="font-size:0.85rem;font-weight:600"></div>
    <div style="display:flex;gap:6px">
      <button onclick="exportCurrentDocAsPDF()">📄 PDF</button>
      <button onclick="shareCurrentDoc()">Share ⤴</button>
    </div>
  </div>
  <div class="viewer-img-wrap"><img id="viewer-img" src=""/></div>
  <div style="display:flex;justify-content:center;gap:8px;padding:10px;overflow-x:auto" id="viewer-pages"></div>
  <div style="text-align:center;padding-bottom:14px"><button class="link-btn" style="color:#ff8a80" onclick="confirmDeleteDoc()">Delete document</button></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@techstark/opencv-js/dist/opencv.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
// ═══════════════════════════════
//  INDEXEDDB
// ═══════════════════════════════
let db=null;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open('avalekhak-db',1);
    req.onupgradeneeded=(e)=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('folders')){
        d.createObjectStore('folders',{keyPath:'id'});
      }
      if(!d.objectStoreNames.contains('documents')){
        const docStore=d.createObjectStore('documents',{keyPath:'id'});
        docStore.createIndex('folderId','folderId',{unique:false});
      }
    };
    req.onsuccess=(e)=>{db=e.target.result;resolve(db);};
    req.onerror=(e)=>reject(e);
  });
}
function dbGetAll(storeName){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(storeName,'readonly');
    const req=tx.objectStore(storeName).getAll();
    req.onsuccess=()=>resolve(req.result);
    req.onerror=(e)=>reject(e);
  });
}
function dbGetOne(storeName,id){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(storeName,'readonly');
    const req=tx.objectStore(storeName).get(id);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=(e)=>reject(e);
  });
}
function dbPut(storeName,obj){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(storeName,'readwrite');
    tx.objectStore(storeName).put(obj);
    tx.oncomplete=()=>resolve();
    tx.onerror=(e)=>reject(e);
  });
}
function dbDelete(storeName,id){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(storeName,'readwrite');
    tx.objectStore(storeName).delete(id);
    tx.oncomplete=()=>resolve();
    tx.onerror=(e)=>reject(e);
  });
}
function dbGetByIndex(storeName,indexName,value){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(storeName,'readonly');
    const req=tx.objectStore(storeName).index(indexName).getAll(value);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=(e)=>reject(e);
  });
}

// ═══════════════════════════════
//  UTILITIES
// ═══════════════════════════════
function escapeHtml(s){
  const d=document.createElement('div');
  d.textContent=s==null?'':s;
  return d.innerHTML;
}
function formatDate(ts){
  return new Date(ts).toLocaleDateString('en-US',{day:'numeric',month:'short',year:'2-digit'});
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}

// ═══════════════════════════════
//  FOLDERS
// ═══════════════════════════════
let folders=[];
let currentFolderId=null;
let currentFolderDocs=[];
const FOLDER_EMOJIS=['📁','🧾','📑','🪪','📝','💳','🏠','⚖️','🩺','🎓','✈️','🚗'];
let selectedEmoji='📁';

async function loadFolders(){
  folders=await dbGetAll('folders');
  folders.sort((a,b)=>a.name.localeCompare(b.name));
}

async function renderFoldersGrid(){
  await loadFolders();
  const el=document.getElementById('folders-grid');
  if(!folders.length){
    el.innerHTML=`<div class="empty-state" style="grid-column:1/-1"><div class="ic">📁</div><div class="txt">No folders yet — tap "+ New Folder" above to create your first one.</div></div>`;
    return;
  }
  const counts={};
  for(const f of folders){
    const docs=await dbGetByIndex('documents','folderId',f.id);
    counts[f.id]=docs.length;
  }
  el.innerHTML=folders.map(f=>`<button class="folder-card" onclick="openFolder('${f.id}')">
    <div class="ic">${f.icon||'📁'}</div>
    <div class="name">${escapeHtml(f.name)}</div>
    <div class="count">${counts[f.id]||0} document${counts[f.id]===1?'':'s'}</div>
  </button>`).join('');
}

function openNewFolderModal(){
  selectedEmoji='📁';
  document.getElementById('new-folder-name').value='';
  document.getElementById('folder-emoji-pick').innerHTML=FOLDER_EMOJIS.map(e=>
    `<span class="${e===selectedEmoji?'sel':''}" onclick="pickEmoji('${e}',this)">${e}</span>`).join('');
  openModal('new-folder-modal');
}
function pickEmoji(e,el){
  selectedEmoji=e;
  document.querySelectorAll('#folder-emoji-pick span').forEach(s=>s.classList.remove('sel'));
  el.classList.add('sel');
}
async function saveNewFolder(){
  const name=document.getElementById('new-folder-name').value.trim();
  if(!name){showToast('Please enter a folder name');return;}
  await dbPut('folders',{id:crypto.randomUUID(),name,icon:selectedEmoji,createdAt:Date.now()});
  closeModal('new-folder-modal');
  showToast('Folder created ✅');
  renderFoldersGrid();
}
function openRenameFolderModal(){
  const f=folders.find(x=>x.id===currentFolderId);
  document.getElementById('rename-folder-name').value=f?f.name:'';
  openModal('rename-folder-modal');
}
async function saveRenameFolder(){
  const name=document.getElementById('rename-folder-name').value.trim();
  if(!name){showToast('Please enter a name');return;}
  const f=folders.find(x=>x.id===currentFolderId);
  f.name=name;
  await dbPut('folders',f);
  closeModal('rename-folder-modal');
  document.getElementById('folder-detail-name').textContent=name;
  showToast('Renamed ✅');
}
async function confirmDeleteFolder(){
  const f=folders.find(x=>x.id===currentFolderId);
  if(!f)return;
  if(!confirm(`Delete "${f.name}" and all ${currentFolderDocs.length} document(s) inside it? This can't be undone.`))return;
  for(const d of currentFolderDocs){await dbDelete('documents',d.id);}
  await dbDelete('folders',currentFolderId);
  showToast('Folder deleted');
  goHome();
}

function openFolder(id){
  currentFolderId=id;
  const f=folders.find(x=>x.id===id);
  document.getElementById('folder-detail-name').textContent=f?f.name:'';
  document.getElementById('view-home').classList.add('hidden');
  document.getElementById('view-folder').classList.remove('hidden');
  document.getElementById('search-input').value='';
  renderDocsGrid();
}
function goHome(){
  currentFolderId=null;
  document.getElementById('view-folder').classList.add('hidden');
  document.getElementById('view-home').classList.remove('hidden');
  document.getElementById('search-input').value='';
  renderFoldersGrid();
}

// ═══════════════════════════════
//  DOCUMENTS (list/view/share/delete)
// ═══════════════════════════════
function docCardHtml(d){
  return `<div class="doc-card">
    <div class="thumb" onclick="openViewer('${d.id}')"><img src="${d.pages[0].dataUrl}"/></div>
    <div class="meta">
      <div>
        <div class="title">${escapeHtml(d.title)}</div>
        <div class="sub">${d.pages.length} page${d.pages.length===1?'':'s'} &middot; ${formatDate(d.createdAt)}</div>
      </div>
      <button class="share-ic" onclick="event.stopPropagation();shareDoc('${d.id}')">⤴</button>
    </div>
  </div>`;
}
async function renderDocsGrid(){
  currentFolderDocs=await dbGetByIndex('documents','folderId',currentFolderId);
  currentFolderDocs.sort((a,b)=>b.createdAt-a.createdAt);
  const el=document.getElementById('docs-grid');
  if(!currentFolderDocs.length){
    el.innerHTML=`<div class="empty-state" style="grid-column:1/-1"><div class="ic">📄</div><div class="txt">No documents yet — tap the camera button to scan your first one.</div></div>`;
    return;
  }
  el.innerHTML=currentFolderDocs.map(docCardHtml).join('');
}

let viewerDocId=null;
function openViewer(docId){
  viewerDocId=docId;
  const doc=currentFolderDocs.find(d=>d.id===docId);
  if(!doc)return;
  document.getElementById('viewer-title').textContent=doc.title;
  document.getElementById('viewer-img').src=doc.pages[0].dataUrl;
  document.getElementById('viewer-pages').innerHTML=doc.pages.map((p,i)=>
    `<img src="${p.dataUrl}" style="height:50px;border-radius:6px;border:2px solid ${i===0?'#2E6FA3':'transparent'}" onclick="showViewerPage(${i})"/>`).join('');
  document.getElementById('viewer-screen').classList.add('open');
}
function showViewerPage(i){
  const doc=currentFolderDocs.find(d=>d.id===viewerDocId);
  if(!doc)return;
  document.getElementById('viewer-img').src=doc.pages[i].dataUrl;
  document.querySelectorAll('#viewer-pages img').forEach((img,idx)=>{
    img.style.border=idx===i?'2px solid #2E6FA3':'2px solid transparent';
  });
}
function closeViewer(){document.getElementById('viewer-screen').classList.remove('open');}
async function confirmDeleteDoc(){
  if(!confirm('Delete this document? This cannot be undone.'))return;
  await dbDelete('documents',viewerDocId);
  closeViewer();
  showToast('Document deleted');
  renderDocsGrid();
  renderFoldersGrid();
}

async function shareDoc(docId){
  const doc=currentFolderDocs.find(d=>d.id===docId)||await dbGetOne('documents',docId);
  await shareDocument(doc);
}
async function shareCurrentDoc(){
  const doc=currentFolderDocs.find(d=>d.id===viewerDocId)||await dbGetOne('documents',viewerDocId);
  await shareDocument(doc);
}
async function shareDocument(doc){
  if(!doc)return;
  try{
    const files=[];
    for(let i=0;i<doc.pages.length;i++){
      const res=await fetch(doc.pages[i].dataUrl);
      const blob=await res.blob();
      files.push(new File([blob],`${doc.title}-page${i+1}.jpg`,{type:'image/jpeg'}));
    }
    if(navigator.canShare&&navigator.canShare({files})){
      await navigator.share({files,title:doc.title});
    } else {
      downloadDocument(doc);
      showToast('Sharing files isn\'t supported here — downloaded instead.');
    }
  }catch(e){
    if(e.name!=='AbortError')showToast('Could not share — try again.');
  }
}

// ═══════════════════════════════
//  PDF EXPORT
// ═══════════════════════════════
async function buildPdfBlobFromDoc(doc){
  const{jsPDF}=window.jspdf;
  const pdf=new jsPDF({unit:'pt'});
  for(let i=0;i<doc.pages.length;i++){
    const img=await loadImageEl(doc.pages[i].dataUrl);
    const pageW=pdf.internal.pageSize.getWidth();
    const pageH=pdf.internal.pageSize.getHeight();
    const imgRatio=img.width/img.height;
    const pageRatio=pageW/pageH;
    let w,h;
    if(imgRatio>pageRatio){w=pageW;h=pageW/imgRatio;}else{h=pageH;w=pageH*imgRatio;}
    const x=(pageW-w)/2,y=(pageH-h)/2;
    if(i>0)pdf.addPage();
    pdf.addImage(img,'JPEG',x,y,w,h);
  }
  return pdf.output('blob');
}
function loadImageEl(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src=src;
  });
}
async function exportCurrentDocAsPDF(){
  const doc=currentFolderDocs.find(d=>d.id===viewerDocId)||await dbGetOne('documents',viewerDocId);
  if(!doc)return;
  showToast('Building PDF...');
  try{
    const blob=await buildPdfBlobFromDoc(doc);
    const file=new File([blob],`${doc.title}.pdf`,{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:doc.title});
    } else {
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;a.download=`${doc.title}.pdf`;
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('PDF downloaded ✅');
    }
  }catch(e){
    if(e.name!=='AbortError')showToast('Could not build PDF — try again.');
  }
}
function downloadDocument(doc){
  doc.pages.forEach((p,i)=>{
    const a=document.createElement('a');
    a.href=p.dataUrl;
    a.download=`${doc.title}-page${i+1}.jpg`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
  });
}

// ═══════════════════════════════
//  SEARCH (Phase 1: by title/folder name)
// ═══════════════════════════════
function handleSearch(){
  const q=document.getElementById('search-input').value.trim().toLowerCase();
  if(!q){
    if(currentFolderId)renderDocsGrid();else renderFoldersGrid();
    return;
  }
  if(currentFolderId){
    const filtered=currentFolderDocs.filter(d=>d.title.toLowerCase().includes(q));
    const el=document.getElementById('docs-grid');
    el.innerHTML=filtered.length?filtered.map(docCardHtml).join(''):
      `<div class="empty-state" style="grid-column:1/-1"><div class="ic">🔍</div><div class="txt">No matches found.</div></div>`;
  } else {

  }
}

// ═══════════════════════════════
//  CAPTURE / CROP / ENHANCE
// ═══════════════════════════════
let capturedPages=[];
let workingImage=null;
let workingCanvas=null;
let cropPoints=null;
let captureStage='adjust';
let currentColorMode='color';
let draggingCornerIdx=-1;
let cvReady=false;
let warpedMat=null;

// @techstark/opencv-js exposes the global `cv` as a PROMISE that resolves to the
// actual library object — not the ready-to-use module directly. Reassign `cv` to
// the resolved value once it settles, so the rest of the code (cv.Mat, cv.imread,
// etc.) keeps working exactly as written.
function initCv(){
  if(typeof cv==='undefined'){setTimeout(initCv,300);return;}
  if(cv&&typeof cv.then==='function'){
    cv.then(resolvedCv=>{
      cv=resolvedCv;
      cvReady=true;
      updateEngineStatus();
    }).catch(err=>{
      console.error('OpenCV failed to load:',err);
      const el=document.getElementById('engine-status');
      if(el)el.textContent='⚠️ Scanner engine failed to load — check your connection and reload the app.';
    });
  } else if(cv&&cv.Mat){
    // Already resolved / a different build that exposes the module directly
    cvReady=true;
    updateEngineStatus();
  } else {
    setTimeout(initCv,300);
  }
}
initCv();
function updateEngineStatus(){
  const el=document.getElementById('engine-status');
  if(el)el.style.display='none';
}

function startCapture(){
  capturedPages=[];
  document.getElementById('pages-strip').innerHTML='';
  document.getElementById('capture-empty').classList.remove('hidden');
  document.getElementById('capture-working').classList.add('hidden');
  document.getElementById('capture-screen').classList.add('open');
}
function cancelCapture(){
  if(capturedPages.length&&!confirm('Discard scanned pages and exit?'))return;
  if(warpedMat){warpedMat.delete();warpedMat=null;}
  workingImage=null;
  document.getElementById('capture-screen').classList.remove('open');
}

function onImageCaptured(event){
  const file=event.target.files[0];
  if(!file)return;
  const img=new Image();
  const url=URL.createObjectURL(file);
  img.onload=()=>{
    URL.revokeObjectURL(url);
    workingImage=img;
    prepareWorkingCanvas();
    document.getElementById('capture-empty').classList.add('hidden');
    document.getElementById('capture-working').classList.remove('hidden');
    enterAdjustStage(true);
  };
  img.onerror=()=>showToast('Could not load that photo — try again.');
  img.src=url;
  event.target.value='';
}

function prepareWorkingCanvas(){
  const maxDim=1800;
  let w=workingImage.naturalWidth,h=workingImage.naturalHeight;
  if(Math.max(w,h)>maxDim){
    const scale=maxDim/Math.max(w,h);
    w=Math.round(w*scale);h=Math.round(h*scale);
  }
  workingCanvas=document.createElement('canvas');
  workingCanvas.width=w;workingCanvas.height=h;
  workingCanvas.getContext('2d').drawImage(workingImage,0,0,w,h);
}

function defaultCorners(){
  const w=workingCanvas.width,h=workingCanvas.height;
  const m=Math.min(w,h)*0.05;
  return[{x:m,y:m},{x:w-m,y:m},{x:w-m,y:h-m},{x:m,y:h-m}];
}

function orderPoints(pts){
  const sum=pts.map(p=>p.x+p.y);
  const diff=pts.map(p=>p.x-p.y);
  const tl=pts[sum.indexOf(Math.min(...sum))];
  const br=pts[sum.indexOf(Math.max(...sum))];
  const tr=pts[diff.indexOf(Math.max(...diff))];
  const bl=pts[diff.indexOf(Math.min(...diff))];
  return[tl,tr,br,bl];
}

function detectDocumentCorners(mat){
  let gray=new cv.Mat(),blurred=new cv.Mat(),edges=new cv.Mat(),dilated=new cv.Mat();
  let kernel=cv.Mat.ones(5,5,cv.CV_8U);
  let contours=new cv.MatVector(),hierarchy=new cv.Mat();
  try{
    cv.cvtColor(mat,gray,cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray,blurred,new cv.Size(5,5),0);
    cv.Canny(blurred,edges,50,150);
    cv.dilate(edges,dilated,kernel);
    cv.findContours(dilated,contours,hierarchy,cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE);
    let bestPoints=null,maxArea=0;
    const imgArea=mat.rows*mat.cols;
    for(let i=0;i<contours.size();i++){
      let cnt=contours.get(i);
      let area=cv.contourArea(cnt);
      if(area<imgArea*0.2){cnt.delete();continue;}
      let peri=cv.arcLength(cnt,true);
      let approx=new cv.Mat();
      cv.approxPolyDP(cnt,approx,0.02*peri,true);
      if(approx.rows===4&&area>maxArea){
        maxArea=area;
        if(bestPoints)bestPoints.delete();
        bestPoints=approx.clone();
      }
      approx.delete();cnt.delete();
    }
    let corners;
    if(bestPoints){
      corners=[];
      for(let i=0;i<4;i++)corners.push({x:bestPoints.data32S[i*2],y:bestPoints.data32S[i*2+1]});
      bestPoints.delete();
    } else {
      corners=defaultCorners();
    }
    return orderPoints(corners);
  } finally {
    gray.delete();blurred.delete();edges.delete();dilated.delete();kernel.delete();contours.delete();hierarchy.delete();
  }
}

function enterAdjustStage(detectFresh){
  captureStage='adjust';
  document.getElementById('crop-stage-label').textContent='Adjust the corners';
  document.getElementById('mode-pills').style.display='none';
  const dispCanvas=document.getElementById('crop-canvas');
  dispCanvas.width=workingCanvas.width;
  dispCanvas.height=workingCanvas.height;
  dispCanvas.getContext('2d').drawImage(workingCanvas,0,0);
  if(detectFresh){
    if(cvReady){
      try{
        const mat=cv.imread(workingCanvas);
        cropPoints=detectDocumentCorners(mat);
        mat.delete();
      }catch(e){cropPoints=defaultCorners();}
    } else {
      cropPoints=defaultCorners();
    }
  }
  renderCropOverlay();
  renderCapActions();
}

function renderCropOverlay(){
  const svg=document.getElementById('crop-svg');
  const dispCanvas=document.getElementById('crop-canvas');
  const rect=dispCanvas.getBoundingClientRect();
  const scaleX=rect.width/workingCanvas.width;
  const scaleY=rect.height/workingCanvas.height;
  svg.setAttribute('viewBox',`0 0 ${rect.width} ${rect.height}`);
  const pts=cropPoints.map(p=>({x:p.x*scaleX,y:p.y*scaleY}));
  const poly=pts.map(p=>`${p.x},${p.y}`).join(' ');
  let html=`<polygon points="${poly}" fill="rgba(46,111,163,0.14)" stroke="#2E6FA3" stroke-width="2"/>`;
  pts.forEach((p,i)=>{html+=`<circle class="corner-handle" cx="${p.x}" cy="${p.y}" r="12" data-idx="${i}"></circle>`;});
  svg.innerHTML=html;
  svg.querySelectorAll('.corner-handle').forEach(h=>h.addEventListener('pointerdown',onCornerPointerDown));
}
function onCornerPointerDown(e){
  e.preventDefault();
  draggingCornerIdx=parseInt(e.target.dataset.idx);
  const svg=document.getElementById('crop-svg');
  svg.setPointerCapture(e.pointerId);
  svg.addEventListener('pointermove',onCornerPointerMove);
  svg.addEventListener('pointerup',onCornerPointerUp);
}
function onCornerPointerMove(e){
  if(draggingCornerIdx<0)return;
  const dispCanvas=document.getElementById('crop-canvas');
  const rect=dispCanvas.getBoundingClientRect();
  const scaleX=workingCanvas.width/rect.width;
  const scaleY=workingCanvas.height/rect.height;
  let x=(e.clientX-rect.left)*scaleX;
  let y=(e.clientY-rect.top)*scaleY;
  x=Math.max(0,Math.min(workingCanvas.width,x));
  y=Math.max(0,Math.min(workingCanvas.height,y));
  cropPoints[draggingCornerIdx]={x,y};
  renderCropOverlay();
}
function onCornerPointerUp(){
  draggingCornerIdx=-1;
  const svg=document.getElementById('crop-svg');
  svg.removeEventListener('pointermove',onCornerPointerMove);
  svg.removeEventListener('pointerup',onCornerPointerUp);
}

function renderCapActions(){
  const el=document.querySelector('.cap-actions');
  if(captureStage==='adjust'){
    el.innerHTML=`<button class="btn-outline" onclick="retakePage()">Retake</button>
      <button class="btn-primary" onclick="confirmCrop()">Crop &amp; Continue</button>`;
  } else {
    el.innerHTML=`<button class="btn-outline" onclick="backToAdjust()">Back</button>
      <button class="btn-outline" onclick="addAnotherPage()">+ Add Page</button>
      <button class="btn-amber" onclick="finishCapture()">Done ✓</button>`;
  }
}

function dist(a,b){return Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2);}

function confirmCrop(){
  if(!cvReady){showToast('Still loading image processing — please wait a few seconds and try again.');return;}
  try{
    applyWarpAndColor();
  }catch(e){
    alert('Crop failed: '+(e.message||e)+'\n\nPlease screenshot this message and share it so I can fix it.');
    return;
  }
  captureStage='enhance';
  document.getElementById('crop-stage-label').textContent='Enhance';
  document.getElementById('mode-pills').style.display='flex';
  document.getElementById('crop-svg').innerHTML='';
  currentColorMode='color';
  document.querySelectorAll('.mode-pill').forEach(p=>p.classList.toggle('active',p.dataset.mode==='color'));
  renderCapActions();
}
function backToAdjust(){
  if(warpedMat){warpedMat.delete();warpedMat=null;}
  enterAdjustStage(false);
}

function applyWarpAndColor(){
  const srcMat=cv.imread(workingCanvas);
  const pts=cropPoints;
  const maxWidth=Math.round(Math.max(dist(pts[0],pts[1]),dist(pts[3],pts[2])));
  const maxHeight=Math.round(Math.max(dist(pts[0],pts[3]),dist(pts[1],pts[2])));
  const srcTri=cv.matFromArray(4,1,cv.CV_32FC2,[pts[0].x,pts[0].y,pts[1].x,pts[1].y,pts[2].x,pts[2].y,pts[3].x,pts[3].y]);
  const dstTri=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,maxWidth,0,maxWidth,maxHeight,0,maxHeight]);
  const M=cv.getPerspectiveTransform(srcTri,dstTri);
  const dst=new cv.Mat();
  cv.warpPerspective(srcMat,dst,M,new cv.Size(maxWidth,maxHeight),cv.INTER_LINEAR,cv.BORDER_CONSTANT,new cv.Scalar());
  if(warpedMat)warpedMat.delete();
  warpedMat=dst;
  srcMat.delete();srcTri.delete();dstTri.delete();M.delete();
  renderColorMode();
}

function renderColorMode(){
  if(!warpedMat)return;
  let out=new cv.Mat();
  if(currentColorMode==='color'){
    warpedMat.copyTo(out);
  } else if(currentColorMode==='gray'){
    cv.cvtColor(warpedMat,out,cv.COLOR_RGBA2GRAY);
  } else if(currentColorMode==='bw'){
    let gray=new cv.Mat();
    cv.cvtColor(warpedMat,gray,cv.COLOR_RGBA2GRAY);
    cv.adaptiveThreshold(gray,out,255,cv.ADAPTIVE_THRESH_GAUSSIAN_C,cv.THRESH_BINARY,25,15);
    gray.delete();
  } else if(currentColorMode==='enhance'){
    out.delete();
    out=autoEnhance(warpedMat);
  }
  const dispCanvas=document.getElementById('crop-canvas');
  dispCanvas.width=out.cols;dispCanvas.height=out.rows;
  cv.imshow(dispCanvas,out);
  out.delete();
}

// One-tap "Auto Enhance": shadow/uneven-lighting removal (divide by a heavily
// blurred estimate of the background), contrast boost (CLAHE), then a light
// unsharp-mask sharpen — combined into one clean result, like real scanner apps.
function autoEnhance(srcMat){
  let gray=new cv.Mat(),bg=new cv.Mat(),grayF=new cv.Mat(),bgF=new cv.Mat(),normF=new cv.Mat(),norm8=new cv.Mat();
  let contrasted=new cv.Mat(),blur2=new cv.Mat(),sharpened=new cv.Mat();
  let clahe=null;
  try{
    cv.cvtColor(srcMat,gray,cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray,bg,new cv.Size(0,0),21);
    gray.convertTo(grayF,cv.CV_32F);
    bg.convertTo(bgF,cv.CV_32F);
    cv.divide(grayF,bgF,normF);
    normF.convertTo(norm8,cv.CV_8U,255.0,0);
    clahe=new cv.CLAHE(2.0,new cv.Size(8,8));
    clahe.apply(norm8,contrasted);
    cv.GaussianBlur(contrasted,blur2,new cv.Size(0,0),3);
    cv.addWeighted(contrasted,1.5,blur2,-0.5,0,sharpened);
    const result=new cv.Mat();
    sharpened.copyTo(result);
    return result;
  } finally {
    gray.delete();bg.delete();grayF.delete();bgF.delete();normF.delete();norm8.delete();
    contrasted.delete();blur2.delete();sharpened.delete();
    if(clahe)clahe.delete();
  }
}
function setColorMode(mode){
  currentColorMode=mode;
  document.querySelectorAll('.mode-pill').forEach(p=>p.classList.toggle('active',p.dataset.mode===mode));
  renderColorMode();
}

function retakePage(){
  if(warpedMat){warpedMat.delete();warpedMat=null;}
  workingImage=null;
  document.getElementById('capture-working').classList.add('hidden');
  document.getElementById('capture-empty').classList.remove('hidden');
}

function addAnotherPage(){
  if(!warpedMat){showToast('Nothing to add yet.');return;}
  capturedPages.push({dataUrl:document.getElementById('crop-canvas').toDataURL('image/jpeg',0.88)});
  renderPagesStrip();
  warpedMat.delete();warpedMat=null;
  workingImage=null;
  document.getElementById('capture-working').classList.add('hidden');
  document.getElementById('capture-empty').classList.remove('hidden');
  showToast(`Page ${capturedPages.length} added`);
}
function renderPagesStrip(){
  const el=document.getElementById('pages-strip');
  el.innerHTML=capturedPages.map(p=>`<img src="${p.dataUrl}" style="height:60px;border-radius:6px;border:1px solid var(--border)"/>`).join('');
}

function finishCapture(){
  if(warpedMat){
    capturedPages.push({dataUrl:document.getElementById('crop-canvas').toDataURL('image/jpeg',0.88)});
    warpedMat.delete();warpedMat=null;
  }
  if(!capturedPages.length){showToast('Nothing scanned yet.');return;}
  openSaveDocModal();
}

async function openSaveDocModal(){
  await loadFolders();
  if(!folders.length){
    showToast('Create a folder first before saving.');
    return;
  }
  const sel=document.getElementById('save-doc-folder');
  sel.innerHTML=folders.map(f=>`<option value="${f.id}" ${f.id===currentFolderId?'selected':''}>${f.icon} ${escapeHtml(f.name)}</option>`).join('');
  document.getElementById('save-doc-title').value='';
  openModal('save-doc-modal');
}
async function confirmSaveDocument(){
  const title=document.getElementById('save-doc-title').value.trim()||'Untitled';
  const folderId=document.getElementById('save-doc-folder').value;
  const doc={id:crypto.randomUUID(),folderId,title,pages:capturedPages,createdAt:Date.now(),updatedAt:Date.now()};
  await dbPut('documents',doc);
  closeModal('save-doc-modal');
  document.getElementById('capture-screen').classList.remove('open');
  capturedPages=[];
  showToast('Document saved ✅');
  await renderFoldersGrid();
  if(currentFolderId===folderId)await renderDocsGrid();
}

// ═══════════════════════════════
//  PDF IMPORT
// ═══════════════════════════════
if(typeof pdfjsLib!=='undefined'){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
}

async function onPdfImportSelected(event){
  const file=event.target.files[0];
  event.target.value='';
  if(!file)return;
  if(typeof pdfjsLib==='undefined'){showToast('PDF import engine still loading — try again in a moment.');return;}
  showToast('Reading PDF...');
  try{
    const buf=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    capturedPages=[];
    const maxDim=1800;
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i);
      const viewport1=page.getViewport({scale:1});
      const scale=Math.min(2,maxDim/Math.max(viewport1.width,viewport1.height));
      const viewport=page.getViewport({scale:Math.max(scale,0.5)});
      const canvas=document.createElement('canvas');
      canvas.width=viewport.width;canvas.height=viewport.height;
      await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;
      capturedPages.push({dataUrl:canvas.toDataURL('image/jpeg',0.88)});
    }
    showToast(`Imported ${pdf.numPages} page(s) — choose a folder to save into`);
    // Suggest the PDF's filename (minus extension) as the default title
    document.getElementById('capture-screen').classList.remove('open');
    await openSaveDocModal();
    const titleEl=document.getElementById('save-doc-title');
    if(titleEl)titleEl.value=file.name.replace(/\.pdf$/i,'');
  }catch(e){
    console.error(e);
    showToast('Could not read that PDF — it may be corrupted or password-protected.');
  }
}
